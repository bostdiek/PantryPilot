name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version (e.g. 1.0.0) to tag & push images"
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # Default VITE_API_URL used for build artifacts in CI (override in release jobs if needed)
  VITE_API_URL: http://localhost:8000

jobs:
  lint-test:
    name: Lint & Test (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Backend deps
        working-directory: apps/backend
        run: uv sync --locked --group dev

      - name: Backend lint
        working-directory: apps/backend
        run: uv run ruff check .

      - name: Backend type check
        working-directory: apps/backend
        run: MYPYPATH=src uv run mypy -p api -p core -p crud -p dependencies -p models -p schemas

      - name: Backend tests
        working-directory: apps/backend
        run: uv run pytest -q

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Frontend deps
        working-directory: apps/frontend
        run: npm ci --include=dev

      - name: Frontend lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Frontend type check
        working-directory: apps/frontend
        run: npm run type-check

      - name: Frontend unit tests
        working-directory: apps/frontend
        run: npm test -- --run

  build-images:
    name: Build & (optional) Push Images
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tag
        id: vars
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Use short SHA for non-tag builds
            echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend image (multi-arch)
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-frontend:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-frontend:latest
          platforms: linux/amd64,linux/arm64

      - name: Build backend image (multi-arch)
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-backend:${{ steps.vars.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-backend:latest
          platforms: linux/amd64,linux/arm64

      - name: Summary
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$PUBLISH_IMAGES" = "true" ]; then
            echo "Images built and pushed for linux/amd64 and linux/arm64:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Images built for linux/amd64 and linux/arm64 (PR validation only; not pushed):" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Frontend: ${REGISTRY}/${IMAGE_NAMESPACE}/pantrypilot-frontend:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: ${REGISTRY}/${IMAGE_NAMESPACE}/pantrypilot-backend:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
